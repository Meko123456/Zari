name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Test + build + lint
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:lintDebug --stacktrace

      # R8 and resource shrinking only run for release, so a debug-only CI lets the release build
      # rot unnoticed.
      - name: Release build (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease :app:lintVitalRelease --stacktrace
